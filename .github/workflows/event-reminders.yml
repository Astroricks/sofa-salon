name: Send event reminders

on:
  schedule:
    # GitHub Actions uses UTC: about 10:17 PDT / 09:17 PST in Seattle.
    - cron: '17 17 * * *'
  workflow_dispatch:

permissions: {}

jobs:
  send-reminders:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Trigger tomorrow's reminder batch
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          test -n "$CRON_SECRET"
          curl --fail --silent --show-error --retry 2 --retry-all-errors \
            --header "Authorization: Bearer $CRON_SECRET" \
            https://ironpillar-theater.sidefold.org/api/cron/event-reminders
